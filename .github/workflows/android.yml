name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify release baseline
        run: ./scripts/verify-release.sh

      - name: Verify host stability matrix
        run: ./scripts/verify-stability-matrix.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentdeck-beta-verification
          if-no-files-found: warn
          retention-days: 7
          path: |
            android/app/build/outputs/apk/secure/beta/app-secure-arm64-v8a-beta.apk
            android/app/build/outputs/apk/secure/beta/app-secure-x86_64-beta.apk
            android/app/build/outputs/apk/lab/beta/app-lab-arm64-v8a-beta.apk
            android/app/build/outputs/apk/lab/beta/app-lab-x86_64-beta.apk
            android/app/build/reports/lint-results-secureBeta.html
            android/app/build/reports/lint-results-labBeta.html
            android/app/build/reports/stability/host-matrix.json
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/macrobenchmark/build/outputs/apk/
