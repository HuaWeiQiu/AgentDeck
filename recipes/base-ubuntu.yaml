schema_version: 1
id: recipe_proot_ubuntu
name: proot-distro + Ubuntu
description: 在 Termux 中准备固定为 Ubuntu 24.04 的 Codex 运行基础环境。
priority: p0
version: "ubuntu:24.04"
available: true
depends_on: []
timeout_minutes: 30
install:
  runtime: termux
  script: |
    set -euo pipefail
    pkg update -y
    pkg install -y proot-distro
    if proot-distro login ubuntu -- /usr/bin/env true >/dev/null 2>&1; then
      installed_version="$(proot-distro login ubuntu -- /usr/bin/env bash -c '. /etc/os-release && printf "%s" "$VERSION_ID"')"
      if [[ "$installed_version" != "24.04" ]]; then
        echo "现有 ubuntu 为 ${installed_version:-unknown}；AgentDeck 不会自动删除数据，请手动迁移到 ubuntu:24.04" >&2
        exit 3
      fi
    else
      proot-distro install ubuntu:24.04 --name ubuntu
    fi
    proot-distro login ubuntu -- /usr/bin/env bash -c '
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y ca-certificates curl git
    '
    echo "Ubuntu 基础环境已准备"
verify:
  runtime: termux
  script: |
    set -euo pipefail
    command -v proot-distro >/dev/null
    proot-distro login ubuntu -- /usr/bin/env bash -c '
      set -euo pipefail
      test "$(. /etc/os-release && printf "%s" "$ID")" = "ubuntu"
      test "$(. /etc/os-release && printf "%s" "$VERSION_ID")" = "24.04"
      command -v curl >/dev/null
      command -v sha256sum >/dev/null
      command -v tar >/dev/null
    '
